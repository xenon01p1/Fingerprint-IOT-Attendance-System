name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  backend-test:
    runs-on: ubuntu-latest
    # Normally GitHub starts here:  
    # fingerprint/
    # If it ran:
    # npm ci
    # it would fail because there's no package.json at the repository root.

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Use an existing GitHub Action version 4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build project
        run: npm run build

      - name: Run unit tests
        run: npm test