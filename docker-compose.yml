services:
  web:
    depends_on:
      backend:
        condition: service_started
    build:
      context: ./website
      dockerfile: Dockerfile
    ports:
      - "3000:80"

  backend:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: mysql://root:password@db:3306/fingerprint
    ports:
      - "8000:8000"

  db:
    image: mariadb:11
    restart: unless-stopped
    command: --lower-case-table-names=1
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: fingerprint
      MARIADB_USER: fingerprint
      MARIADB_PASSWORD: fingerprint123
    ports:
      - "3308:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mariadb_data: